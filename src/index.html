<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Healthy Bites</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Healthy Bites: planes alimenticios, seguimiento de hábitos y una comunidad para comer mejor."
    />
    <meta name="theme-color" content="#10291f" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <!--
      Pantalla de carga: se ve en cuanto llega el HTML, antes que el JavaScript, y Angular la sustituye al arrancar.
      Las clases las genera Tailwind (también lee este archivo).
    -->
    <app-root>
      <div class="grid min-h-dvh place-items-center bg-canvas" role="status">
        <div class="flex flex-col items-center gap-4 motion-safe:animate-pulse">
          <!-- eslint-disable-next-line @angular-eslint/template/prefer-ngsrc -- Angular aún no ha arrancado. -->
          <img src="favicon.svg" width="56" height="56" alt="" />
          <p class="text-sm font-semibold text-muted">Cargando Healthy Bites…</p>
        </div>
      </div>
    </app-root>
    <noscript>Healthy Bites necesita JavaScript para funcionar.</noscript>
  </body>
</html>
