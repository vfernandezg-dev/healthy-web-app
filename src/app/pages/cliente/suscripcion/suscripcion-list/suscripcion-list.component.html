@if (loading) {
  <div class="loading-spinner">Cargando...</div>
}

<form [formGroup]="subscriptionForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="tipoSuscripcion">Selecciona un tipo de suscripción:</label>
    <select formControlName="tipoSuscripcion" id="tipoSuscripcion" required>
      @for (tipo of tiposSuscripcion; track tipo) {
        <option [value]="tipo">{{ tipo }}</option>
      }
    </select>
  </div>

  <button type="submit" [disabled]="subscriptionForm.invalid || loading">
    Suscribirme
  </button>
</form>
