<app-page-header
  title="Facturación"
  description="Suscripciones y pagos con PayPal. Los importes van en la moneda de cada plan."
/>

<section class="mb-10" aria-labelledby="billing-summary-title">
  <h2 id="billing-summary-title" class="sr-only">Resumen</h2>
  @if (summary.error()) {
    <app-load-error [error]="summary.error()" (retry)="summary.reload()" />
  } @else if (summary.hasValue()) {
    <ul class="stat-ledger motion-safe:animate-rise sm:grid-cols-2 xl:grid-cols-4" role="list">
      <li>
        <app-stat-card
          label="Suscripciones vigentes"
          [value]="activeTotal()"
          [detail]="activeDetail()"
        />
      </li>
      <li>
        <app-stat-card
          label="Ingreso mensual recurrente"
          [value]="format(summary.value().monthlyRecurringRevenue)"
        />
      </li>
      <li>
        <app-stat-card
          label="Ingresos (30 días)"
          [value]="format(summary.value().revenueLast30Days)"
        />
      </li>
      <li>
        <app-stat-card label="Pagos (30 días)" [value]="summary.value().paymentsLast30Days" />
      </li>
    </ul>
  } @else {
    <div class="stat-ledger sm:grid-cols-2 xl:grid-cols-4" aria-busy="true">
      @for (placeholder of [1, 2, 3, 4]; track placeholder) {
        <div class="space-y-3 bg-card p-5 sm:p-6">
          <p-skeleton height="1rem" width="50%" />
          <p-skeleton height="2.25rem" width="35%" />
        </div>
      }
    </div>
  }
</section>

<p-tabs [(value)]="tab">
  <p-tablist>
    <p-tab value="subscriptions">Suscripciones</p-tab>
    <p-tab value="payments">Pagos</p-tab>
  </p-tablist>
  <p-tabpanels class="px-0!">
    <p-tabpanel value="subscriptions">
      <app-subscriptions-table />
    </p-tabpanel>
    <p-tabpanel value="payments">
      <!-- La tabla de pagos va en su propio chunk: se carga al abrir la pestaña y conserva su estado. -->
      @defer (when tab() === 'payments'; prefetch on idle) {
        <app-payments-table />
      }
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
