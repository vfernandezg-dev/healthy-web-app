<a
  href="#main"
  class="sr-only z-50 rounded-full bg-brand-700 px-4 py-2 font-semibold text-white focus:not-sr-only focus:fixed focus:top-3 focus:left-3"
>
  Saltar al contenido
</a>

<div class="min-h-dvh lg:pl-72">
  <aside
    class="fixed inset-y-0 left-0 z-30 hidden w-72 flex-col border-r border-brand-100 bg-white lg:flex"
  >
    <div class="px-6 py-6">
      <a [routerLink]="home()" class="inline-flex rounded-lg"><app-brand-logo /></a>
    </div>
    <nav aria-label="Principal" class="flex-1 overflow-y-auto px-4 pb-4">
      <ng-container [ngTemplateOutlet]="navList" />
    </nav>
    <div class="border-t border-brand-100 p-4">
      <ng-container [ngTemplateOutlet]="account" />
    </div>
  </aside>

  <header
    class="sticky top-0 z-20 flex items-center justify-between border-b border-brand-100 bg-white/90 px-4 py-3 backdrop-blur lg:hidden"
  >
    <a [routerLink]="home()" class="inline-flex rounded-lg"><app-brand-logo /></a>
    <button
      pButton
      type="button"
      severity="secondary"
      variant="text"
      [iconOnly]="true"
      aria-label="Abrir el menú"
      aria-haspopup="dialog"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(true)"
    >
      <svg lucideMenu></svg>
    </button>
  </header>

  <p-drawer
    [(visible)]="menuOpen"
    position="left"
    header="Menú"
    ariaCloseLabel="Cerrar el menú"
    styleClass="w-80! max-w-[85vw]"
  >
    <nav aria-label="Principal" class="flex h-full flex-col">
      <div class="flex-1">
        <ng-container [ngTemplateOutlet]="navList" />
      </div>
      <div class="mt-6 border-t border-brand-100 pt-4">
        <ng-container [ngTemplateOutlet]="account" />
      </div>
    </nav>
  </p-drawer>

  <main #main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-10">
    <router-outlet />
  </main>
</div>

<ng-template #navList>
  <ul class="space-y-1" role="list">
    @for (item of navigation(); track item.link) {
      <li>
        <a
          [routerLink]="item.link"
          routerLinkActive="bg-brand-50 font-semibold text-brand-800"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          ariaCurrentWhenActive="page"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-muted transition-colors hover:bg-brand-50 hover:text-ink"
        >
          <svg [lucideIcon]="item.icon"></svg>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</ng-template>

<ng-template #account>
  @if (user(); as user) {
    <div class="flex items-center gap-3">
      <p-avatar [label]="initials()" shape="circle" class="bg-mint! font-bold text-brand-900!" />
      <div class="min-w-0 flex-1">
        <p class="truncate font-semibold">{{ user.firstName }} {{ user.lastName }}</p>
        <p class="text-sm text-muted">{{ roleLabel() }}</p>
      </div>
    </div>
    <button
      pButton
      type="button"
      severity="secondary"
      variant="text"
      class="mt-3 w-full justify-start!"
      (click)="logout()"
    >
      <svg lucideLogOut></svg>
      Cerrar sesión
    </button>
  }
</ng-template>
