<a
  href="#main"
  class="sr-only z-50 rounded-control bg-brand-700 px-4 py-2 font-semibold text-white focus:not-sr-only focus:fixed focus:top-3 focus:left-3"
>
  Saltar al contenido
</a>

<div class="min-h-dvh lg:pl-64">
  <aside
    class="hb-on-pine fixed inset-y-0 left-0 z-30 hidden w-64 flex-col bg-pine text-on-pine lg:flex"
  >
    <div class="px-5 pt-6 pb-8">
      <a [routerLink]="home()" class="inline-flex rounded-md">
        <app-brand-logo [inverse]="true" />
      </a>
    </div>
    <nav aria-label="Principal" class="flex-1 overflow-y-auto px-3 pb-4">
      <ng-container [ngTemplateOutlet]="navList" />
    </nav>
    <div class="border-t border-pine-line p-4">
      <ng-container [ngTemplateOutlet]="account" />
    </div>
  </aside>

  <header
    class="hb-on-pine sticky top-0 z-20 flex items-center justify-between bg-pine px-4 py-3 text-on-pine lg:hidden"
  >
    <a [routerLink]="home()" class="inline-flex rounded-md">
      <app-brand-logo [inverse]="true" />
    </a>
    <button
      pButton
      type="button"
      severity="secondary"
      variant="text"
      [iconOnly]="true"
      aria-label="Abrir el menú"
      aria-haspopup="dialog"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(true)"
    >
      <svg lucideMenu></svg>
    </button>
  </header>

  <p-drawer
    [(visible)]="menuOpen"
    position="left"
    header="Menú"
    ariaCloseLabel="Cerrar el menú"
    styleClass="hb-on-pine w-80! max-w-[85vw]"
  >
    <nav aria-label="Principal" class="flex h-full flex-col">
      <div class="flex-1">
        <ng-container [ngTemplateOutlet]="navList" />
      </div>
      <div class="mt-6 border-t border-pine-line pt-4">
        <ng-container [ngTemplateOutlet]="account" />
      </div>
    </nav>
  </p-drawer>

  <main #main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-10">
    <router-outlet />
  </main>
</div>

<!--
  Enlaces del menú. El activo lleva aria-current="page" (RouterLinkActive) y se pinta a partir de ese atributo: fondo
  más claro, texto en crema y una barra caqui a la izquierda que crece desde el centro (subrayado en modo de alto
  contraste).
-->
<ng-template #navList>
  <ul class="hb-stagger space-y-0.5" role="list">
    @for (item of navigation(); track item.link) {
      <li>
        <a
          [routerLink]="item.link"
          routerLinkActive=""
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          ariaCurrentWhenActive="page"
          class="relative flex items-center gap-3 rounded-md px-3 py-2 font-medium text-on-pine-muted transition-colors before:absolute before:inset-y-2 before:left-0 before:w-0.75 before:scale-y-0 before:rounded-full before:bg-accent-400 before:transition-transform before:duration-300 hover:bg-pine-raised hover:text-on-pine aria-[current=page]:bg-pine-raised aria-[current=page]:font-semibold aria-[current=page]:text-on-pine aria-[current=page]:before:scale-y-100 forced-colors:aria-[current=page]:underline"
        >
          <svg [lucideIcon]="item.icon"></svg>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</ng-template>

<!-- Cuenta, en una fila: avatar, nombre (recortado si no cabe) y rol, y el botón de salir a la derecha. -->
<ng-template #account>
  @if (user()) {
    <div class="flex items-center gap-3">
      <app-person-avatar [name]="fullName()" />
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-on-pine" [title]="fullName()">
          {{ fullName() }}
        </p>
        <p class="truncate text-xs text-on-pine-muted">{{ roleLabel() }}</p>
      </div>
      <button
        pButton
        type="button"
        severity="secondary"
        variant="text"
        [iconOnly]="true"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        (click)="logout()"
      >
        <svg lucideLogOut></svg>
      </button>
    </div>
  }
</ng-template>
