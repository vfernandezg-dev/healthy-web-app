<div class="grid min-h-dvh lg:grid-cols-[5fr_6fr]">
  <!-- Escritorio: panel de marca en verde pino, con una foto real y el lema (un párrafo: el h1 es el de la página). -->
  <section class="hb-on-pine hidden flex-col bg-pine p-10 text-on-pine lg:flex xl:p-14">
    <a [href]="landingUrl" class="w-fit rounded-md"><app-brand-logo [inverse]="true" /></a>
    <div class="relative mt-10 min-h-48 flex-1 overflow-hidden rounded-lg">
      <img ngSrc="images/auth-bowl.webp" fill alt="" class="object-cover" />
    </div>
    <p class="mt-10 max-w-md font-display text-3xl leading-tight text-balance xl:text-4xl">
      Come mejor, un hábito cada día.
    </p>
    <p class="mt-3 max-w-md text-on-pine-muted">
      Planes de nutricionistas, pesajes y hábitos en un mismo sitio.
    </p>
    <p class="mt-10 text-sm text-on-pine-muted">© {{ year }} Healthy Bites</p>
  </section>

  <div class="flex min-h-dvh flex-col">
    <!-- Móvil: franja de marca. -->
    <div
      class="hb-on-pine flex items-center justify-between gap-4 bg-pine px-6 py-4 text-on-pine lg:hidden"
    >
      <app-brand-logo [inverse]="true" />
      <a [href]="landingUrl" class="text-sm font-semibold text-on-pine hover:underline">
        Volver a la web
      </a>
    </div>
    <main id="main" tabindex="-1" class="flex flex-1 flex-col px-6 py-8 sm:px-10">
      <div class="hidden justify-end lg:flex">
        <a [href]="landingUrl" class="text-sm font-semibold text-brand-700 hover:underline">
          Volver a la web
        </a>
      </div>
      <div class="mx-auto flex w-full max-w-md flex-1 flex-col py-4 lg:justify-center lg:py-10">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
