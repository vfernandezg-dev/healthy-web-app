# Configuración de pnpm para este proyecto (no es un monorepo).

# Protección de supply chain: solo se instalan versiones publicadas hace al menos 24 h
# (1440 minutos). Así, una versión comprometida tiene tiempo de detectarse y retirarse
# antes de llegar aquí. Debe coincidir en local y en CI.
minimumReleaseAge: 1440

# pnpm no ejecuta scripts de instalación de dependencias salvo los que se aprueban aquí.
# Los usa el CLI de Angular: esbuild (binario del bundler) y lmdb/msgpackr-extract (caché persistente).
# Se deniegan:
# - nice-napi (opcional de piscina, solo en Linux/macOS): compila código nativo y piscina funciona
#   igual sin él.
# - @parcel/watcher: su script solo compila desde fuentes si se pide; el binario llega precompilado
#   en @parcel/watcher-<plataforma>.
allowBuilds:
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nice-napi: false
  '@parcel/watcher': false

# La app es zoneless, pero zone.js llega como peer opcional de @angular/core. Sin izarlo, el builder de
# tests (que busca zone.js para cargar zone.js/testing) no lo encuentra y arranca TestBed sin zone.js.
hoistPattern:
  - '*'
  - '!zone.js'

# Dependencias transitivas de las herramientas (no llegan al bundle de producción) con avisos de seguridad:
# - karma: peer opcional de @angular/build que pnpm instalaba aunque los tests usan Vitest (angular.json). Arrastraba
#   socket.io, engine.io, ws, qs, lodash, tmp, follow-redirects... con 16 avisos. Se quita del árbol.
# - El resto se fuerza a la primera versión corregida de cada rama.
overrides:
  karma: '-'
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  brace-expansion@<1.1.21: ^1.1.21
  minimatch@<3.1.3: ^3.1.3
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  glob@>=9.0.0 <14.0.2: ^14.0.2
